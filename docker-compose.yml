services:
  db:
    image: mysql:8.4
    container_name: stock-portfolio-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: stock_portfolio
      MYSQL_USER: portfolio_app
      MYSQL_PASSWORD: portfolio_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uportfolio_app", "-pportfolio_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
